name: Publicar notícia

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: publicar-noticias
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) &&
      startsWith(github.event.issue.title, '[Notícia]')
    runs-on: ubuntu-latest
    steps:
      - name: Obter o site
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Criar artigo e atualizar a lista
        id: publish
        run: node scripts/publish-news.js

      - name: Publicar os ficheiros
        env:
          ARTICLE_SLUG: ${{ steps.publish.outputs.slug }}
          ARTICLE_IMAGE: ${{ steps.publish.outputs.image }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/news.json "$ARTICLE_IMAGE" "$ARTICLE_SLUG/index.html"
          git commit -m "Publica notícia"
          git push origin main

      - name: Fechar o pedido
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue close "$ISSUE_NUMBER" --reason completed --comment "Artigo criado e adicionado à lista de notícias."
